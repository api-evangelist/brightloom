aid: brightloom
name: Brightloom
description: 'Brightloom is a San Francisco customer data and customer intelligence
  platform for restaurant and retail brands. It began as Eatsa, the automated quinoa-bowl
  restaurant chain, and rebranded to Brightloom in 2019 when Starbucks licensed select
  components of its Digital Flywheel customer engagement software to the company,
  took an equity stake and a board seat alongside a $30M round. The product unifies
  point-of-sale, loyalty, ecommerce and marketing data into a single customer view,
  reports on data health, runs AI-driven hyper-segmentation and anomaly detection over
  that data, and recommends the next campaign and audience a brand should target.
  Brightloom is sold as an end-user SaaS with prebuilt connectors to common POS, loyalty
  and marketing platforms rather than as a developer platform: it publishes no public
  API reference, developer portal, SDK or machine-readable specification.'
