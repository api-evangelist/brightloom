aid: brightloom
name: Brightloom
description: 'Brightloom is a San Francisco customer data and customer intelligence
  platform for restaurant and retail brands. It began as Eatsa, the automated quinoa-bowl
  restaurant chain, and rebranded to Brightloom in 2019 when Starbucks licensed select
  components of its Digital Flywheel customer engagement software to the company,
  took an equity stake and a board seat alongside a $30M round. The product unifies
  point-of-sale, loyalty, ecommerce and marketing data into a single customer view,
  reports on data health, runs AI-driven hyper-segmentation and anomaly detection over
  that data, and recommends the next campaign and audience a brand should target.
  Brightloom was sold as an end-user SaaS with prebuilt connectors to common POS, loyalty
  and marketing platforms rather than as a developer platform, and it published no public
  API reference, developer portal, SDK or machine-readable specification. The company now
  appears defunct: the last dated item on its own press page is December 2022, the entire
  operating estate it once held TLS certificates for is gone from DNS — api.brightloom.com,
  api-prd/api-dev, the cgp.brightloom.com application, its auth0-cgp Auth0 tenant, and the
  status, support and knowledgebase hosts all NXDOMAIN — brightloom.com publishes no MX
  record, and only the frozen marketing site remains, with its /about/ page defaced by
  injected search-spam.'
